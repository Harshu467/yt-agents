<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Workflow - YouTube Automation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #333;
            margin-bottom: 5px;
        }
        
        .header p {
            color: #666;
            font-size: 14px;
        }
        
        .workflow-steps {
            display: block;
            margin-bottom: 20px;
        }

        .stepper {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stepper-item {
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.8);
            color: #444;
            border-radius: 10px;
            font-size: 12px;
            padding: 10px;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
        }

        .stepper-item.active {
            background: #667eea;
            color: white;
        }

        .stepper-item.done {
            background: #4caf50;
            color: white;
        }

        .wizard-controls {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .step-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: all 0.3s;
            max-width: 900px;
            margin: 0 auto;
        }
        
        .step-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }
        
        .step-card.active {
            border-top: 4px solid #667eea;
        }
        
        .step-header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .step-icon {
            font-size: 32px;
        }
        
        .step-title {
            flex: 1;
        }
        
        .step-title h3 {
            font-size: 18px;
            margin-bottom: 3px;
        }
        
        .step-title p {
            font-size: 12px;
            opacity: 0.9;
        }
        
        .step-status {
            padding: 5px 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .step-content {
            padding: 20px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
        }
        
        .content-box {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            flex: 1;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
        }
        
        .content-box h4 {
            color: #333;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            color: #667eea;
        }
        
        .content-box p,
        .content-box ul {
            color: #666;
            font-size: 13px;
            line-height: 1.6;
        }
        
        .content-box ul {
            margin-left: 20px;
            margin-top: 10px;
        }
        
        .content-box li {
            margin-bottom: 8px;
        }
        
        .step-actions {
            display: flex;
            gap: 10px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }
        
        .button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-nav {
            max-width: 220px;
        }
        
        .btn-generate {
            background: #667eea;
            color: white;
        }
        
        .btn-generate:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
        }
        
        .btn-approve {
            background: #4caf50;
            color: white;
        }
        
        .btn-approve:hover:not(:disabled) {
            background: #45a049;
        }
        
        .btn-reject {
            background: #f44336;
            color: white;
        }
        
        .btn-reject:hover:not(:disabled) {
            background: #da190b;
        }
        
        .btn-upload {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            font-size: 16px;
        }
        
        .btn-upload:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .status-pending { color: #ff9800; }
        .status-completed { color: #4caf50; }
        .status-approved { color: #2196f3; }
        .status-rejected { color: #f44336; }
        
        .progress-bar {
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s;
        }
        
        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .upload-config {
            margin-top: 10px;
            display: grid;
            gap: 10px;
        }

        .upload-config label {
            font-size: 12px;
            color: #555;
            font-weight: 600;
        }

        .upload-config input,
        .upload-config select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📹 Video Creation Workflow</h1>
            <p id="topicDisplay">Topic: Loading...</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        
        <div class="workflow-steps" id="stepsContainer">
            <!-- Steps will be inserted here -->
        </div>

        <div class="stepper" id="wizardStepper"></div>

        <div class="wizard-controls">
            <button class="button btn-reject btn-nav" id="prevStepBtn" onclick="goToPreviousStep()">← Previous Step</button>
            <button class="button btn-generate btn-nav" id="nextStepBtn" onclick="goToNextStep()">Next Step →</button>
        </div>
        
        <button class="button btn-upload" id="uploadBtn" disabled onclick="finalUpload()">
            📤 Upload to YouTube
        </button>
        
        <!-- Video History/Gallery Section -->
        <div style="background: white; border-radius: 15px; box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1); padding: 30px; margin-top: 30px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="color: #333; margin: 0;">📹 Generated Videos History</h2>
                <button id="deleteAllBtn" class="button" style="padding: 10px 20px; background: #dc3545; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; display: none;" onclick="deleteAllVideos()">
                    🗑️ Delete All Videos
                </button>
            </div>
            <div id="videoHistory" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;">
                <p style="grid-column: 1/-1; color: #999; text-align: center;">Loading video history...</p>
            </div>
        </div>
    </div>
    
    <script>
        const steps = ['research', 'script', 'metadata', 'video', 'upload'];
        const workflowId = window.location.pathname.split('/').pop();
        let currentStepIndex = 0;
        
        // Initialize workflow
        async function initWorkflow() {
            // Create step cards
            steps.forEach(step => {
                const card = createStepCard(step);
                document.getElementById('stepsContainer').appendChild(card);
            });

            renderStepper();
            
            // Update display
            await updateWorkflow();
            showCurrentStep();
        }

        function renderStepper() {
            const stepper = document.getElementById('wizardStepper');
            const labels = {
                research: '1. Research',
                script: '2. Script',
                metadata: '3. SEO',
                video: '4. Video',
                upload: '5. Upload'
            };
            stepper.innerHTML = steps.map((step, idx) => `
                <div class="stepper-item ${idx === currentStepIndex ? 'active' : ''}" id="stepper-${step}" onclick="goToStep(${idx})">${labels[step]}</div>
            `).join('');
        }

        function canOpenStep(index) {
            if (index <= 0) return true;
            const previousStep = steps[index - 1];
            const previousStatus = document.getElementById(`status-${previousStep}`)?.textContent?.toLowerCase() || '';
            return previousStatus === 'approved' || (window.stepStates && window.stepStates[previousStep] === 'approved');
        }

        function showCurrentStep() {
            steps.forEach((step, idx) => {
                const card = document.getElementById(`step-${step}`);
                card.style.display = idx === currentStepIndex ? 'block' : 'none';
                card.classList.toggle('active', idx === currentStepIndex);
            });

            steps.forEach((step, idx) => {
                const item = document.getElementById(`stepper-${step}`);
                if (!item) return;
                item.classList.remove('active', 'done');
                if (idx === currentStepIndex) item.classList.add('active');
                const status = document.getElementById(`status-${step}`)?.textContent?.toLowerCase() || '';
                if (status === 'approved' || (window.stepStates && window.stepStates[step] === 'approved')) {
                    item.classList.add('done');
                }
            });

            document.getElementById('prevStepBtn').disabled = currentStepIndex === 0;
            document.getElementById('nextStepBtn').disabled = currentStepIndex >= steps.length - 1 || !canOpenStep(currentStepIndex + 1);
        }

        function goToStep(index) {
            if (!canOpenStep(index)) {
                alert('Please approve the previous step first.');
                return;
            }
            currentStepIndex = index;
            showCurrentStep();
        }

        function goToPreviousStep() {
            if (currentStepIndex > 0) {
                currentStepIndex -= 1;
                showCurrentStep();
            }
        }

        function goToNextStep() {
            if (currentStepIndex < steps.length - 1 && canOpenStep(currentStepIndex + 1)) {
                currentStepIndex += 1;
                showCurrentStep();
            } else {
                alert('Approve this step before moving to the next one.');
            }
        }
        
        function createStepCard(step) {
            const icons = {
                research: '📚',
                script: '✍️',
                metadata: '🏷️',
                video: '🎬',
                upload: '📤'
            };
            
            const titles = {
                research: 'Research',
                script: 'Script Writing',
                metadata: 'Metadata & SEO',
                video: 'Video Generation',
                upload: 'Upload & Publish'
            };
            
            const descriptions = {
                research: 'Gather data and insights',
                script: 'Create video script',
                metadata: 'YouTube metadata',
                video: 'Generate video file',
                upload: 'Publish to YouTube'
            };
            
            const div = document.createElement('div');
            div.className = 'step-card';
            div.id = `step-${step}`;
            div.innerHTML = `
                <div class="step-header">
                    <div class="step-icon">${icons[step]}</div>
                    <div class="step-title">
                        <h3>${titles[step]}</h3>
                        <p>${descriptions[step]}</p>
                    </div>
                    <div class="step-status" id="status-${step}">Pending</div>
                </div>
                <div class="step-content">
                    <div class="loading" id="loading-${step}">
                        <div class="spinner"></div>
                        <p>Processing...</p>
                    </div>
                    <div class="content-box" id="content-${step}" style="display: none;">
                        <!-- Content will be inserted here -->
                    </div>
                    <div class="step-actions" id="actions-${step}">
                        <button class="button btn-generate" onclick="generateStep('${step}')">
                            ${step === 'upload' ? 'Prepare Upload' : 'Generate'}
                        </button>
                    </div>
                </div>
            `;
            return div;
        }
        
        async function generateStep(step) {
            const btn = event.target;
            btn.disabled = true;
            
            // Show loading
            document.getElementById(`loading-${step}`).style.display = 'block';
            document.getElementById(`content-${step}`).style.display = 'none';
            
            try {
                const response = await fetch(`/api/workflow/${workflowId}/step/${step}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    displayStepContent(step, data.data);
                    updateStepStatus(step, 'completed');
                    updateProgressBar();
                } else {
                    alert(`Error: ${data.error}`);
                }
            } catch (error) {
                alert(`Error generating ${step}: ${error.message}`);
            } finally {
                document.getElementById(`loading-${step}`).style.display = 'none';
                btn.disabled = false;
            }
        }
        
        function displayStepContent(step, data) {
            const contentBox = document.getElementById(`content-${step}`);
            const actionsBox = document.getElementById(`actions-${step}`);
            
            contentBox.style.display = 'block';
            
            // Format content
            let html = '';
            
            if (step === 'research') {
                const keyPoints = Array.isArray(data?.key_points) ? data.key_points : [];
                html = `
                    <h4>Summary</h4>
                    <p>${data?.summary || 'No summary available yet.'}</p>
                    <h4 style="margin-top: 15px;">Key Points</h4>
                    <ul>
                        ${keyPoints.length ? keyPoints.map(p => `<li>${p}</li>`).join('') : '<li>No key points available.</li>'}
                    </ul>
                `;
            } else if (step === 'script') {
                const segments = Array.isArray(data?.segments) ? data.segments : [];
                const scenes = Array.isArray(data?.scenes) ? data.scenes : [];
                const scriptItems = segments.length
                    ? segments.map(s => `<li><strong>${s.title || 'Segment'}</strong> (${s.duration || 'N/A'}s)</li>`).join('')
                    : scenes.length
                        ? scenes.map((s, idx) => `<li><strong>Scene ${idx + 1}</strong> ${s.narration ? `- ${s.narration.substring(0, 90)}...` : ''}</li>`).join('')
                        : '<li>No scene breakdown available.</li>';
                html = `
                    <h4>Hook</h4>
                    <p>${data?.hook || data?.intro || 'No hook available.'}</p>
                    <h4 style="margin-top: 15px;">Main Script</h4>
                    <p>${data?.body || 'No script body available.'}</p>
                    <h4 style="margin-top: 15px;">Scenes / Segments</h4>
                    <ul>
                        ${scriptItems}
                    </ul>
                `;
            } else if (step === 'metadata') {
                const tags = Array.isArray(data?.tags) ? data.tags : [];
                html = `
                    <h4>Title</h4>
                    <p>${data?.title || 'No title generated.'}</p>
                    <h4 style="margin-top: 15px;">Description</h4>
                    <p>${data?.description || 'No description generated.'}</p>
                    <h4 style="margin-top: 15px;">Tags</h4>
                    <p>${tags.length ? tags.join(', ') : 'No tags generated.'}</p>
                `;
            } else if (step === 'video') {
                const statusColor = data.status === 'generated' ? '#d4edda' : 
                                   data.status === 'error' ? '#f8d7da' : '#fff3cd';
                const statusBgColor = data.status === 'generated' ? '#c3e6cb' : 
                                     data.status === 'error' ? '#f5c6cb' : '#ffeaa7';
                
                // Build video info
                let videoInfo = `
                    <h4>Video Details</h4>
                    <ul>
                        <li>Resolution: ${data.resolution}</li>
                        <li>Duration: ${data.duration}</li>
                        <li>Filename: ${data.filename || 'N/A'}</li>
                        <li>File Size: ${data.file_size ? (data.file_size / 1024).toFixed(1) : 'N/A'} KB</li>
                        <li>Status: <strong>${data.status.toUpperCase()}</strong></li>
                    </ul>
                `;
                
                // Add video player if generated
                let videoPlayer = '';
                if (data.video_id && data.status === 'generated') {
                    videoPlayer = `
                        <h4>Video Preview</h4>
                        <div class="video-player-container" style="margin-bottom: 15px;">
                            <video id="videoPlayer" style="width: 100%; max-height: 300px; background: #000; border-radius: 8px;" controls>
                                <source src="/api/videos/${data.video_id}" type="video/mp4">
                                <source src="/api/videos/${data.video_id}?format=webm" type="video/webm">
                                Your browser does not support the video tag. Try downloading the video directly.
                            </video>
                        </div>
                    `;
                }
                
                html = videoPlayer + videoInfo + (data.message ? `
                    <div style="background: ${statusColor}; padding: 15px; border-radius: 8px; border: 1px solid ${statusBgColor}; margin-top: 15px; font-size: 13px; line-height: 1.6;">
                        <p style="white-space: pre-wrap; margin: 0; color: #333;">${data.message}</p>
                    </div>
                ` : '');
            } else if (step === 'upload') {
                if (data.url) {
                    html = `
                        <div style="background: #d4edda; padding: 15px; border-radius: 8px; border: 1px solid #c3e6cb;">
                            <h4 style="color: #155724; margin-bottom: 10px;">✅ Upload Successful!</h4>
                            <p><strong>Video ID:</strong> ${data.video_id}</p>
                            <p><strong>URL:</strong> <a href="${data.url}" target="_blank" style="color: #0066cc;">${data.url}</a></p>
                            <p><strong>Title:</strong> ${data.title || 'N/A'}</p>
                            <p><strong>Description:</strong> ${data.description ? data.description.substring(0, 100) + '...' : 'N/A'}</p>
                            <p style="font-size: 12px; color: #666; margin-top: 10px;"><em>Your video is now live on YouTube!</em></p>
                        </div>
                    `;
                } else {
                    html = `
                        <h4>Ready to Upload</h4>
                        <p>Configure your YouTube upload settings, click <strong>Accept Upload Setup</strong>, then press Upload to YouTube.</p>
                        <div class="upload-config">
                            <div>
                                <label for="channelName">Channel Name</label>
                                <input type="text" id="channelName" placeholder="e.g. My Automation Channel">
                            </div>
                            <div>
                                <label for="privacyStatus">Privacy Status</label>
                                <select id="privacyStatus">
                                    <option value="public">Public</option>
                                    <option value="private">Private</option>
                                    <option value="unlisted">Unlisted</option>
                                </select>
                            </div>
                            <div>
                                <label for="playlistId">Playlist ID (Optional)</label>
                                <input type="text" id="playlistId" placeholder="PLxxxxxxxxxxxxx">
                            </div>
                        </div>
                    `;
                }
            }
            
            contentBox.innerHTML = html;
            
            // Add approval buttons
            if (step === 'upload' && !data.url) {
                actionsBox.innerHTML = `
                    <button class="button btn-approve" onclick="approveStep('${step}')">
                        ✓ Accept Upload Setup
                    </button>
                    <button class="button btn-reject" onclick="rejectStep('${step}')">
                        ✗ Reset Setup
                    </button>
                `;
            } else {
                actionsBox.innerHTML = `
                    <button class="button btn-approve" onclick="approveStep('${step}')">
                        ✓ Approve
                    </button>
                    <button class="button btn-reject" onclick="rejectStep('${step}')">
                        ✗ Reject
                    </button>
                `;
            }
        }
        
        async function approveStep(step) {
            try {
                const response = await fetch(`/api/workflow/${workflowId}/approve/${step}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Store approval state locally
                    window.stepStates = window.stepStates || {};
                    window.stepStates[step] = 'approved';
                    
                    updateStepStatus(step, 'approved');
                    document.getElementById(`actions-${step}`).innerHTML = `
                        <button class="button btn-approve" disabled>✓ Approved</button>
                    `;
                    updateProgressBar();
                    showCurrentStep();
                    
                    // Auto-move to next step
                    const stepIndex = steps.indexOf(step);
                    if (stepIndex < steps.length - 1) {
                        setTimeout(() => goToStep(stepIndex + 1), 250);
                    }
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }
        
        async function rejectStep(step) {
            if (!confirm(`Reject ${step}? You'll need to generate it again.`)) return;
            
            try {
                await fetch(`/api/workflow/${workflowId}/reject/${step}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                // Clear local state
                window.stepStates = window.stepStates || {};
                delete window.stepStates[step];
                
                updateStepStatus(step, 'pending');
                document.getElementById(`content-${step}`).style.display = 'none';
                document.getElementById(`actions-${step}`).innerHTML = `
                    <button class="button btn-generate" onclick="generateStep('${step}')">
                        Generate
                    </button>
                `;
                showCurrentStep();
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }
        
        async function finalUpload() {
            if (!confirm('Upload this video to YouTube?')) return;
            
            const btn = document.getElementById('uploadBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Uploading...';
            
            try {
                const uploadData = {
                    status: document.getElementById('privacyStatus')?.value || 'public',
                    channel_name: document.getElementById('channelName')?.value || '',
                    playlist_id: document.getElementById('playlistId')?.value || '',
                    timestamp: new Date().toISOString()
                };
                
                const response = await fetch(`/api/workflow/${workflowId}/upload`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(uploadData)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    const message = `✅ Video uploaded!\n\nVideo ID: ${data.video_id}\nURL: ${data.url}`;
                    alert(message);
                    updateStepStatus('upload', 'uploaded');
                    btn.textContent = '✓ Uploaded';
                    
                    // Show completion message
                    const contentBox = document.getElementById('content-upload');
                    contentBox.style.display = 'block';
                    contentBox.innerHTML = `
                        <div style="background: #d4edda; padding: 15px; border-radius: 8px; border: 1px solid #c3e6cb;">
                            <h4 style="color: #155724; margin-bottom: 10px;">✅ Upload Successful!</h4>
                            <p><strong>Video ID:</strong> ${data.video_id}</p>
                            <p><strong>URL:</strong> <a href="${data.url}" target="_blank">${data.url}</a></p>
                            <p><strong>Title:</strong> ${data.title || 'N/A'}</p>
                            <p style="font-size: 12px; color: #666; margin-top: 10px;"><em>Your video is now live on YouTube!</em></p>
                        </div>
                    `;
                } else {
                    alert(`❌ Upload Error: ${data.error || 'Unknown error'}`);
                    btn.disabled = false;
                    btn.textContent = '📤 Upload to YouTube';
                }
            } catch (error) {
                console.error('Upload error:', error);
                alert(`❌ Network Error: ${error.message}`);
                btn.disabled = false;
                btn.textContent = '📤 Upload to YouTube';
            }
        }
        
        function updateStepStatus(step, status) {
            const statusEl = document.getElementById(`status-${step}`);
            const statusClass = `status-${status}`;
            statusEl.className = `step-status ${statusClass}`;
            statusEl.textContent = status.toUpperCase();
        }
        
        function updateProgressBar() {
            const completed = steps.filter(s => {
                // Check local state first
                if (window.stepStates && window.stepStates[s] === 'approved') {
                    return true;
                }
                const status = document.getElementById(`status-${s}`).textContent.toLowerCase();
                return status === 'COMPLETED' || status === 'APPROVED';
            }).length;
            const percentage = (completed / steps.length) * 100;
            document.getElementById('progressFill').style.width = percentage + '%';
            
            // Enable upload if all steps are approved
            const allApproved = steps.every(s => {
                if (window.stepStates && window.stepStates[s] === 'approved') {
                    return true;
                }
                const status = document.getElementById(`status-${s}`).textContent.toLowerCase();
                return status === 'APPROVED';
            });
            document.getElementById('uploadBtn').disabled = !allApproved;
        }
        
        async function updateWorkflow() {
            try {
                const response = await fetch(`/api/workflow/${workflowId}/summary`);
                const workflow = await response.json();
                
                document.getElementById('topicDisplay').textContent = `Topic: ${workflow.topic}`;
                if (workflow.description) {
                    document.getElementById('topicDisplay').textContent += ` | Description: ${workflow.description}`;
                }
                
                steps.forEach(step => {
                    // Check local state first to avoid overwriting approved status
                    if (window.stepStates && window.stepStates[step] === 'approved') {
                        return; // Skip updating this step, keep local approved state
                    }
                    
                    const stepData = workflow.steps[step];
                    if (stepData.data) {
                        displayStepContent(step, stepData.data);
                    }
                    if (stepData.status !== 'pending') {
                        updateStepStatus(step, stepData.status);
                    }
                });
                
                updateProgressBar();
                showCurrentStep();
            } catch (error) {
                console.error('Error updating workflow:', error);
            }
        }
        
        // Load and display video history
        async function loadVideoHistory() {
            try {
                const response = await fetch('/api/videos/history');
                const data = await response.json();
                
                // Show/hide delete all button based on video count
                const deleteAllBtn = document.getElementById('deleteAllBtn');
                if (data.videos && data.videos.length > 0) {
                    deleteAllBtn.style.display = 'block';
                } else {
                    deleteAllBtn.style.display = 'none';
                }
                
                if (!data.videos || data.videos.length === 0) {
                    document.getElementById('videoHistory').innerHTML = `<p style="grid-column: 1/-1; color: #999; text-align: center;">No videos generated yet</p>`;
                    return;
                }
                
                let html = '';
                data.videos.forEach(video => {
                    const date = new Date(video.created_at).toLocaleDateString() + ' ' + 
                                new Date(video.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    const sizeKB = (video.file_size / 1024).toFixed(1);
                    
                    html += `
                        <div style="background: #f9f9f9; border-radius: 8px; padding: 15px; border: 1px solid #e0e0e0;">
                            <h4 style="margin: 0 0 10px 0; color: #333;">${video.topic}</h4>
                            <p style="margin: 5px 0; font-size: 12px; color: #666;">
                                <strong>Generated:</strong> ${date}
                            </p>
                            <p style="margin: 5px 0; font-size: 12px; color: #666;">
                                <strong>Size:</strong> ${sizeKB} KB
                            </p>
                            <div style="margin-top: 10px; display: flex; gap: 10px;">
                                <button class="button" style="flex: 1; padding: 8px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;" onclick="playVideoModal('${video.id}', '${video.topic}')">
                                    ▶️ Play
                                </button>
                                <button class="button" style="flex: 1; padding: 8px; background: #f44336; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;" onclick="deleteVideoFromHistory('${video.id}')">
                                    🗑️ Delete
                                </button>
                            </div>
                        </div>
                    `;
                });
                
                document.getElementById('videoHistory').innerHTML = html;
            } catch (error) {
                console.error('Error loading video history:', error);
                document.getElementById('videoHistory').innerHTML = `<p style="grid-column: 1/-1; color: #999; text-align: center;">Error loading video history</p>`;
            }
        }
        
        // Play video in modal
        function playVideoModal(videoId, topic) {
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.7);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 9999;
            `;
            
            modal.innerHTML = `
                <div style="background: white; border-radius: 10px; padding: 20px; max-width: 900px; width: 90%;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <h3 style="margin: 0;">${topic}</h3>
                        <button onclick="this.parentElement.parentElement.parentElement.remove()" style="background: none; border: none; font-size: 24px; cursor: pointer;">✕</button>
                    </div>
                    <video style="width: 100%; height: auto; background: #000; border-radius: 8px;" controls>
                        <source src="/api/videos/${videoId}" type="video/mp4">
                        <source src="/api/videos/${videoId}?format=webm" type="video/webm">
                        Your browser does not support video playback. <a href="/api/videos/${videoId}" download>Download video</a>
                    </video>
                </div>
            `;
            
            document.body.appendChild(modal);
            modal.onclick = function(e) {
                if (e.target === modal) modal.remove();
            };
        }
        
        // Delete video from history
        async function deleteVideoFromHistory(videoId) {
            if (!confirm('Delete this video?')) return;
            
            try {
                const response = await fetch(`/api/videos/${videoId}`, { method: 'DELETE' });
                if (response.ok) {
                    loadVideoHistory();
                } else {
                    alert('Error deleting video');
                }
            } catch (error) {
                console.error('Error deleting video:', error);
            }
        }
        
        async function deleteAllVideos() {
            if (!confirm('Are you sure you want to delete ALL videos? This action cannot be undone!')) return;
            
            try {
                const response = await fetch('/api/videos/delete-all', { method: 'DELETE' });
                const result = await response.json();
                
                if (response.ok) {
                    alert(`Deleted ${result.deleted} videos successfully!`);
                    loadVideoHistory();
                } else {
                    alert('Error deleting videos');
                }
            } catch (error) {
                console.error('Error deleting all videos:', error);
                alert('Error deleting videos');
            }
        }
        
        // Initialize on load
        initWorkflow();
        loadVideoHistory();
        
        // Reload history every 30 seconds
        setInterval(loadVideoHistory, 30000);
        
        // Only update when tab is visible (stop continuous polling)
        // Use Page Visibility API to avoid unnecessary network calls
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                updateWorkflow();
            }
        });
        
        // Optional: Update on user action completion, not on interval
        window.stepStates = {};
    </script>
</body>
</html>
